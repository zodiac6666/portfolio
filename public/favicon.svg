<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="55%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <rect x="0" y="4" width="64" height="60" rx="18" fill="#14B8A6" opacity="0.18" />

  <!-- tile -->
  <rect x="2" y="0" width="60" height="60" rx="16" fill="url(#brand)" />

  <!-- inner ring -->
  <rect x="4.5" y="2.5" width="55" height="55" rx="14" fill="none"
    stroke="#99F6E4" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- accent dot -->
  <circle cx="50" cy="10" r="3.5" fill="#F0FDFA" />

  <!-- wordmark -->
  <text x="32" y="42" text-anchor="middle"
    font-family="'JetBrains Mono', Consolas, 'Courier New', monospace"
    font-size="24" font-weight="800" fill="#062A26" letter-spacing="1">YB</text>
</svg>